<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f242c" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#388bfd" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1f242c" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="200" fill="url(#bgGrad)"/>

  <!-- Wave Accent Layers -->
  <path d="M0,135 C180,185 360,95 540,150 C680,190 770,140 850,165 L850,200 L0,200 Z" fill="url(#waveGrad)"/>
  <path d="M0,155 C220,115 440,185 640,135 C740,110 800,145 850,150 L850,200 L0,200 Z" fill="#0d1117"/>

  <!-- Glowing Accent Line -->
  <path d="M0,155 C220,115 440,185 640,135 C740,110 800,145 850,150" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Typography -->
  <text x="50%" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="1">
    s3lfcoded
  </text>

  <text x="50%" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8b949e" letter-spacing="3">
    SYSTEMS &amp; BACKEND ENGINEERING • LOW-LATENCY • RUST
  </text>
